<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#9db9e8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <pattern id="gridlg" width="480" height="480" patternUnits="userSpaceOnUse">
      <path d="M480 0H0V480" fill="none" stroke="#9db9e8" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gridlg)"/>

  <!-- ground line -->
  <line x1="60" y1="830" x2="1880" y2="830" stroke="#dce9fd" stroke-opacity="0.55" stroke-width="2"/>

  <!-- MODERN HOUSE, right third -->
  <g stroke="#e6efff" stroke-linecap="square">
    <!-- main volume: glass wall -->
    <g stroke-opacity="0.85" stroke-width="2">
      <rect x="1100" y="520" width="560" height="310"/>
    </g>
    <!-- mullions -->
    <g stroke-opacity="0.5" stroke-width="1.6">
      <line x1="1170" y1="520" x2="1170" y2="830"/>
      <line x1="1240" y1="520" x2="1240" y2="830"/>
      <line x1="1310" y1="520" x2="1310" y2="830"/>
      <line x1="1380" y1="520" x2="1380" y2="830"/>
      <line x1="1450" y1="520" x2="1450" y2="830"/>
      <line x1="1520" y1="520" x2="1520" y2="830"/>
      <line x1="1590" y1="520" x2="1590" y2="830"/>
      <line x1="1100" y1="675" x2="1660" y2="675" stroke-opacity="0.35"/>
    </g>
    <!-- cantilevered roof slab -->
    <line x1="1058" y1="512" x2="1700" y2="512" stroke="#8fb4ff" stroke-opacity="0.95" stroke-width="4"/>
    <line x1="1058" y1="504" x2="1700" y2="504" stroke="#8fb4ff" stroke-opacity="0.4" stroke-width="1.6"/>

    <!-- upper volume, vertical siding -->
    <g stroke-opacity="0.65" stroke-width="1.8">
      <rect x="1200" y="330" width="360" height="182"/>
    </g>
    <g stroke-opacity="0.35" stroke-width="1.3">
      <line x1="1230" y1="330" x2="1230" y2="512"/>
      <line x1="1260" y1="330" x2="1260" y2="512"/>
      <line x1="1290" y1="330" x2="1290" y2="512"/>
      <line x1="1320" y1="330" x2="1320" y2="512"/>
      <line x1="1350" y1="330" x2="1350" y2="512"/>
      <line x1="1380" y1="330" x2="1380" y2="512"/>
      <line x1="1410" y1="330" x2="1410" y2="512"/>
      <line x1="1440" y1="330" x2="1440" y2="512"/>
      <line x1="1470" y1="330" x2="1470" y2="512"/>
      <line x1="1500" y1="330" x2="1500" y2="512"/>
      <line x1="1530" y1="330" x2="1530" y2="512"/>
    </g>
    <!-- upper ribbon window -->
    <g stroke-opacity="0.6" stroke-width="1.6">
      <rect x="1230" y="372" width="240" height="62"/>
      <line x1="1290" y1="372" x2="1290" y2="434"/>
      <line x1="1350" y1="372" x2="1350" y2="434"/>
      <line x1="1410" y1="372" x2="1410" y2="434"/>
    </g>
    <!-- upper roof slab -->
    <line x1="1176" y1="322" x2="1584" y2="322" stroke="#8fb4ff" stroke-opacity="0.9" stroke-width="3.4"/>

    <!-- entry porch, left of glass wall -->
    <g stroke-opacity="0.55" stroke-width="1.7">
      <rect x="950" y="640" width="150" height="190"/>
      <rect x="984" y="716" width="56" height="114"/>
      <line x1="1012" y1="716" x2="1012" y2="830"/>
      <line x1="932" y1="634" x2="1114" y2="634" stroke="#8fb4ff" stroke-opacity="0.7" stroke-width="2.6"/>
    </g>

    <!-- dimension line -->
    <g stroke-opacity="0.6" stroke-width="1.6">
      <line x1="1100" y1="888" x2="1660" y2="888"/>
      <line x1="1100" y1="874" x2="1100" y2="902"/>
      <line x1="1660" y1="874" x2="1660" y2="902"/>
      <line x1="1091" y1="897" x2="1109" y2="879"/>
      <line x1="1651" y1="897" x2="1669" y2="879"/>
    </g>
    <text x="1380" y="881" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e6efff" fill-opacity="0.6" stroke="none" text-anchor="middle">48&#39;-6&quot;</text>

    <!-- height marker -->
    <g stroke-opacity="0.4" stroke-width="1.4">
      <line x1="1736" y1="322" x2="1736" y2="830"/>
      <line x1="1724" y1="322" x2="1748" y2="322"/>
      <line x1="1724" y1="830" x2="1748" y2="830"/>
    </g>
  </g>

  <!-- FLOOR PLAN fragment, left third -->
  <g stroke="#e6efff" stroke-opacity="0.5" stroke-width="1.8">
    <rect x="110" y="560" width="470" height="270"/>
    <line x1="110" y1="700" x2="580" y2="700"/>
    <line x1="352" y1="560" x2="352" y2="830"/>
    <!-- door swings -->
    <path d="M352 700 A66 66 0 0 1 418 634" fill="none"/>
    <line x1="352" y1="634" x2="418" y2="634"/>
    <path d="M478 700 A58 58 0 0 0 536 758" fill="none"/>
    <line x1="478" y1="700" x2="478" y2="758"/>
    <!-- window markers -->
    <line x1="158" y1="553" x2="290" y2="553" stroke-width="4" stroke-opacity="0.35"/>
    <line x1="410" y1="823" x2="540" y2="823" stroke-width="4" stroke-opacity="0.35"/>
  </g>
  <!-- plan dimension -->
  <g stroke="#e6efff" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="110" y1="524" x2="580" y2="524"/>
    <line x1="110" y1="512" x2="110" y2="536"/>
    <line x1="580" y1="512" x2="580" y2="536"/>
  </g>
  <text x="345" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e6efff" fill-opacity="0.5" stroke="none" text-anchor="middle">36&#39;-0&quot;</text>

  <!-- section marker, upper left -->
  <g stroke="#e6efff" stroke-opacity="0.5" stroke-width="1.7">
    <circle cx="300" cy="240" r="34"/>
    <line x1="300" y1="206" x2="300" y2="274"/>
    <line x1="266" y1="240" x2="334" y2="240"/>
  </g>
  <text x="300" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e6efff" fill-opacity="0.5" stroke="none" text-anchor="middle">A-101</text>

  <!-- title block, bottom right -->
  <g stroke="#e6efff" stroke-opacity="0.42" stroke-width="1.6">
    <rect x="1460" y="946" width="370" height="100"/>
    <line x1="1460" y1="980" x2="1830" y2="980"/>
    <line x1="1460" y1="1013" x2="1830" y2="1013"/>
    <line x1="1645" y1="946" x2="1645" y2="1046"/>
  </g>

  <!-- roof pitch study, upper center-left -->
  <g stroke="#e6efff" stroke-opacity="0.3" stroke-width="1.6">
    <line x1="640" y1="420" x2="790" y2="318"/>
    <line x1="790" y1="318" x2="940" y2="420"/>
    <line x1="640" y1="420" x2="940" y2="420"/>
    <line x1="790" y1="318" x2="790" y2="420" stroke-opacity="0.2"/>
  </g>
</svg>
